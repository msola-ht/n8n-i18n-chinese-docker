          echo "A: 运行 \`docker-compose down\`" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "**Q: 如何更新版本？**" >> README-Docker_N8N.md
          echo "A: 修改 .env 中的 N8N_VERSION，然后运行 \`docker-compose pull && docker-compose up -d\`" >> README-Docker_N8N.md

      - name: 上传 Docker_N8N 到 GitHub Releases
        if: steps.check_release.outputs.need_docker_n8n == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          UPSTREAM_TAG: ${{ steps.get_n8n_version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.package_docker_n8n.outputs.archive_name }}
        run: |
          # 检查是否已存在 Release
          RELEASE_EXISTS=false
          if gh release view "${UPSTREAM_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            echo "Release ${UPSTREAM_TAG} 已存在，将添加 Docker_N8N 压缩包..."
          else
            echo "Release ${UPSTREAM_TAG} 不存在，将创建新 Release..."
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            # 删除旧的 Docker_N8N 文件（如果存在）
            OLD_DOCKER_N8N_ASSET=$(gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[] | select(.name | startswith("Docker_N8N-")) | .name' 2>/dev/null || echo "")
            if [ -n "$OLD_DOCKER_N8N_ASSET" ]; then
              echo "$OLD_DOCKER_N8N_ASSET" | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "${UPSTREAM_TAG}" "$asset" --yes 2>/dev/null || true
              done
            fi

            # 上传新的 Docker_N8N 压缩包和说明文档
            echo "上传 Docker_N8N 压缩包到 Release ${UPSTREAM_TAG}..."
            gh release upload "${UPSTREAM_TAG}" \
              "${ARCHIVE_NAME}" \
              README-Docker_N8N.md || echo "Docker_N8N 压缩包上传失败"
          else
            echo "创建新的 Release ${UPSTREAM_TAG}..."

            # 创建 Release Notes
            echo "## n8n Docker 部署包 Docker_N8N" > /tmp/docker-n8n-release-notes.txt
            echo "" >> /tmp/docker-n8n-release-notes.txt
            echo "版本: ${N8N_VERSION}" >> /tmp/docker-n8n-release-notes.txt
            echo "" >> /tmp/docker-n8n-release-notes.txt
            echo "包含完整的 Docker Compose 配置文件和启动脚本。" >> /tmp/docker-n8n-release-notes.txt
            echo "" >> /tmp/docker-n8n-release-notes.txt
            echo "### 使用方法" >> /tmp/docker-n8n-release-notes.txt
            echo "" >> /tmp/docker-n8n-release-notes.txt
            echo "请查看 README-Docker_N8N.md 文件了解详细使用说明。" >> /tmp/docker-n8n-release-notes.txt

            # 创建 Release 并上传文件
