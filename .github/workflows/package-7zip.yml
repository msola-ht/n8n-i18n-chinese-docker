name: 打包 n8n 镜像为 7zip 格式

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n 版本号（留空自动获取最新版本）'
        required: false
        type: string
      include_postgres:
        description: '是否包含 PostgreSQL 数据库镜像'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      n8n_version:
        description: 'n8n 版本号'
        required: true
        type: string
      upstream_tag:
        description: '上游标签'
        required: true
        type: string
  workflow_run:
    workflows: ["构建 n8n 中文社区版和企业版 Docker 镜像"]
    types: [completed]
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  UPSTREAM_REPO: other-blowsnow/n8n-i18n-chinese

jobs:
  package-7zip:
    # 只在上游工作流成功完成时运行（workflow_run 触发）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 从上游工作流获取版本号（workflow_run 触发）
        id: get_version_from_workflow
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 从上游工作流获取版本信息..."

          # 获取上游工作流的运行 ID
          WORKFLOW_RUN_ID="${{ github.event.workflow_run.id }}"
          echo "上游工作流运行 ID: ${WORKFLOW_RUN_ID}"

          # 从上游工作流 check job 的输出中获取版本号
          # 使用 GitHub API 获取 job 输出
          N8N_VERSION=$(gh api \
            repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/jobs \
            --jq '.jobs[] | select(.name == "check") | .outputs.n8n_version' | head -1)

          TAG=$(gh api \
            repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/jobs \
            --jq '.jobs[] | select(.name == "check") | .outputs.tag' | head -1)

          if [ -z "$N8N_VERSION" ] || [ -z "$TAG" ]; then
            echo "⚠️ 无法从上游工作流获取版本号，尝试从上游 API 获取..."
            # 备用方案：从上游仓库 API 获取最新版本
            latest_release=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
            TAG=$(echo "$latest_release" | jq -r .tag_name | xargs)
            N8N_VERSION=$(echo "${TAG#n8n@}" | xargs)
          fi

          echo "n8n_version=${N8N_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "从上游获取到版本: ${N8N_VERSION} (标签: ${TAG})"

      - name: 获取上游最新发布信息
        id: get_release
        if: github.event.inputs.n8n_version == '' && github.event_name != 'workflow_run'
        run: |
          latest_release=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          tag=$(echo "$latest_release" | jq -r .tag_name | xargs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "检测到上游标签: ${tag}"

      - name: 从标签中提取 n8n 版本号
        id: get_n8n_version
        run: |
          if [ -n "${{ github.event.inputs.n8n_version }}" ]; then
            # 优先级1: 使用手动输入的版本号
            N8N_VERSION="${{ github.event.inputs.n8n_version }}"
            TAG_REF="n8n@${N8N_VERSION}"
          elif [ -n "${{ steps.get_version_from_workflow.outputs.n8n_version }}" ]; then
            # 优先级2: 使用从 workflow_run 获取的版本号
            N8N_VERSION="${{ steps.get_version_from_workflow.outputs.n8n_version }}"
            TAG_REF="${{ steps.get_version_from_workflow.outputs.tag }}"
          else
            # 优先级3: 从上游获取的标签中提取
            TAG_REF="${{ steps.get_release.outputs.tag }}"
            N8N_VERSION=$(echo "${TAG_REF#n8n@}" | xargs)
          fi
          echo "n8n_version=$N8N_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          echo "使用 n8n 版本: ${N8N_VERSION}"

      - name: 检查 Release 是否已存在并判断是否需要打包
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          UPSTREAM_TAG: ${{ steps.get_n8n_version.outputs.tag }}
        run: |
          echo "🔍 检查 Release ${UPSTREAM_TAG} 是否已存在..."

          # 生成预期的文件名
          DATE_FORMAT=$(date +'%y-%-m-%-d')
          IMAGES_ARCHIVE="${DATE_FORMAT}-images-${N8N_VERSION}.7z"
          DOCKER_N8N_ARCHIVE="${DATE_FORMAT}-Docker_N8N-${N8N_VERSION}.7z"

          # 旧格式的文件名（兼容性检查）
          IMAGES_ARCHIVE_OLD="${DATE_FORMAT}-images-${N8N_VERSION}-镜像.7z"

          # 检查 Release 是否存在
          if gh release view "${UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release ${UPSTREAM_TAG} 已存在"

            # 获取 Release 中的所有文件
            ASSETS=$(gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[].name' 2>/dev/null || echo "")

            # 检查旧格式的镜像压缩包是否存在
            if echo "$ASSETS" | grep -q "${IMAGES_ARCHIVE_OLD}"; then
              echo "⚠️ 发现旧格式文件: ${IMAGES_ARCHIVE_OLD}"
              echo "正在删除旧格式文件..."
              gh release delete-asset "${UPSTREAM_TAG}" "${IMAGES_ARCHIVE_OLD}" --yes 2>/dev/null || true
              echo "✅ 已删除旧格式文件"
            fi

            # 检查镜像压缩包是否存在
            if echo "$ASSETS" | grep -q "${IMAGES_ARCHIVE}"; then
              echo "images_exists=true" >> "$GITHUB_OUTPUT"
              echo "  ✓ 镜像压缩包已存在: ${IMAGES_ARCHIVE}"
            else
              echo "images_exists=false" >> "$GITHUB_OUTPUT"
              echo "  ✗ 镜像压缩包不存在: ${IMAGES_ARCHIVE}"
            fi

            # 检查 Docker_N8N 压缩包是否存在
            if echo "$ASSETS" | grep -q "${DOCKER_N8N_ARCHIVE}"; then
              echo "docker_n8n_exists=true" >> "$GITHUB_OUTPUT"
              echo "  ✓ Docker_N8N 压缩包已存在: ${DOCKER_N8N_ARCHIVE}"
            else
              echo "docker_n8n_exists=false" >> "$GITHUB_OUTPUT"
              echo "  ✗ Docker_N8N 压缩包不存在: ${DOCKER_N8N_ARCHIVE}"
            fi

            # 判断是否需要打包
            if echo "$ASSETS" | grep -q "${IMAGES_ARCHIVE}" && echo "$ASSETS" | grep -q "${DOCKER_N8N_ARCHIVE}"; then
              echo "skip_all=true" >> "$GITHUB_OUTPUT"
              echo ""
              echo "=========================================="
              echo "所有文件已存在，跳过打包！"
              echo "=========================================="
            elif echo "$ASSETS" | grep -q "${IMAGES_ARCHIVE}"; then
              # 镜像包存在，Docker_N8N 不存在
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
              echo "need_docker_n8n=true" >> "$GITHUB_OUTPUT"
              echo ""
              echo "=========================================="
              echo "镜像包已存在，只需打包 Docker_N8N"
              echo "=========================================="
            elif echo "$ASSETS" | grep -q "${DOCKER_N8N_ARCHIVE}"; then
              # Docker_N8N 存在，镜像包不存在
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
              echo "need_images=true" >> "$GITHUB_OUTPUT"
              echo ""
              echo "=========================================="
              echo "Docker_N8N 已存在，只需打包镜像"
              echo "=========================================="
            else
              # 两个都不存在
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
              echo "need_images=true" >> "$GITHUB_OUTPUT"
              echo "need_docker_n8n=true" >> "$GITHUB_OUTPUT"
              echo ""
              echo "=========================================="
              echo "所有文件都不存在，需要打包"
              echo "=========================================="
            fi
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "images_exists=false" >> "$GITHUB_OUTPUT"
            echo "docker_n8n_exists=false" >> "$GITHUB_OUTPUT"
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            echo "need_images=true" >> "$GITHUB_OUTPUT"
            echo "need_docker_n8n=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release ${UPSTREAM_TAG} 不存在，需要创建并打包所有文件"
          fi

          # 输出文件名供后续步骤使用
          echo "images_archive=${IMAGES_ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "docker_n8n_archive=${DOCKER_N8N_ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: 安装 7zip
        if: steps.check_release.outputs.need_images == 'true' || steps.check_release.outputs.need_docker_n8n == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: 从发行版下载镜像文件或导出 PostgreSQL
        id: download_images
        if: steps.check_release.outputs.need_images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          UPSTREAM_TAG: ${{ steps.get_n8n_version.outputs.tag }}
          INCLUDE_POSTGRES: ${{ github.event.inputs.include_postgres || 'true' }}
        run: |
          echo "📦 准备镜像文件..."
          mkdir -p docker-export

          # 从发行版下载 CN 镜像
          echo "📥 下载 n8n-chinese-cn-${N8N_VERSION}.tar.gz..."
          gh release download "${UPSTREAM_TAG}" --pattern "n8n-chinese-cn-${N8N_VERSION}.tar.gz" --dir docker-export/
          echo "✅ CN 镜像下载完成"

          # 从发行版下载 n8n-runners（如果存在）
          if gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[].name' | grep -q "n8n-runners-${N8N_VERSION}.tar.gz"; then
            echo "📥 下载 n8n-runners-${N8N_VERSION}.tar.gz..."
            if gh release download "${UPSTREAM_TAG}" --pattern "n8n-runners-${N8N_VERSION}.tar.gz" --dir docker-export/ 2>/dev/null; then
              echo "✅ n8n-runners 镜像下载完成"
              echo "has_runners_tar=true" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ n8n-runners 下载失败，跳过"
              echo "has_runners_tar=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "⚠️ 发行版中没有 n8n-runners，跳过"
            echo "has_runners_tar=false" >> "$GITHUB_OUTPUT"
          fi

          # 处理 PostgreSQL 镜像
          if [ "$INCLUDE_POSTGRES" = "true" ]; then
            if gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[].name' | grep -q "postgres-16.tar.gz"; then
              echo "📥 下载 postgres-16.tar.gz..."
              if gh release download "${UPSTREAM_TAG}" --pattern "postgres-16.tar.gz" --dir docker-export/ 2>/dev/null; then
                echo "✅ PostgreSQL 镜像下载完成"
                echo "has_postgres=true" >> "$GITHUB_OUTPUT"
              else
                echo "⚠️ PostgreSQL 下载失败，将导出..."
                echo "📥 拉取 postgres:16 镜像..."
                docker pull postgres:16
                echo "📦 导出 postgres:16 镜像为 tar.gz 格式..."
                docker save postgres:16 | gzip > docker-export/postgres-16.tar.gz
                echo "✅ PostgreSQL 镜像导出完成"
                echo "has_postgres=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "⚠️ 发行版中没有 PostgreSQL，将导出..."
              echo "📥 拉取 postgres:16 镜像..."
              docker pull postgres:16
              echo "📦 导出 postgres:16 镜像为 tar.gz 格式..."
              docker save postgres:16 | gzip > docker-export/postgres-16.tar.gz
              echo "✅ PostgreSQL 镜像导出完成"
              echo "has_postgres=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_postgres=false" >> "$GITHUB_OUTPUT"
          fi

          echo "✅ 所需镜像文件准备完成"

      - name: 使用 7zip 打包镜像
        id: package
        if: steps.check_release.outputs.need_images == 'true'
        env:
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
        run: |
          # 生成日期格式：YY-M-D (例如：26-1-9)
          DATE_FORMAT=$(date +'%y-%-m-%-d')
          echo "date_format=${DATE_FORMAT}" >> "$GITHUB_OUTPUT"

          # 文件名格式：26-1-9-images-2.2.5.7z
          ARCHIVE_NAME="${DATE_FORMAT}-images-${N8N_VERSION}.7z"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

          echo "📦 开始使用 7zip 压缩镜像..."
          echo "压缩包名称: ${ARCHIVE_NAME}"

          # 进入 docker-export 目录并打包所有镜像文件（tar 和 tar.gz）
          cd docker-export
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "../${ARCHIVE_NAME}" *.tar *.tar.gz 2>/dev/null || \
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "../${ARCHIVE_NAME}" *.tar
          cd ..

          echo "✅ 压缩完成"
          echo "📊 压缩包大小: $(du -h "${ARCHIVE_NAME}" | cut -f1)"

      - name: 创建使用说明文档
        if: steps.check_release.outputs.need_images == 'true'
        env:
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          INCLUDE_POSTGRES: ${{ steps.download_images.outputs.has_postgres || github.event.inputs.include_postgres || 'true' }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "# n8n 镜像压缩包（7zip 格式）" > README-7zip.md
          echo "" >> README-7zip.md
          echo "## 包含的镜像" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "1. **CN 镜像（国内源优化版）**" >> README-7zip.md
          echo "   - 镜像名: ${DOCKER_USER}/n8n-chinese-cn:${N8N_VERSION}" >> README-7zip.md
          echo "   - 说明: 使用国内 npm 镜像源构建，适合国内用户" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "2. **n8n-runners 官方镜像**" >> README-7zip.md
          echo "   - 镜像名: n8nio/runners:${N8N_VERSION}" >> README-7zip.md
          echo "   - 说明: n8n 官方 runners 镜像，用于执行工作流节点" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "3. **PostgreSQL 数据库镜像**" >> README-7zip.md
          echo "   - 镜像名: postgres:16" >> README-7zip.md
          echo "   - 说明: PostgreSQL 16 数据库，可用于 n8n 数据存储" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "## 使用方法" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "### 1. 解压文件" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "使用 7-Zip 或其他支持 7z 格式的工具解压下载的文件。" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Windows:**" >> README-7zip.md
          echo "- 右键点击文件 -> 7-Zip -> 提取到当前文件夹" >> README-7zip.md
          echo "- 或使用命令行：" >> README-7zip.md
          echo '  ```cmd' >> README-7zip.md
          echo "  7z x ${ARCHIVE_NAME}" >> README-7zip.md
          echo '  ```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Linux/Mac:**" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "7z x ${ARCHIVE_NAME}" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "### 2. 导入镜像" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "解压后，直接在当前目录导入 Docker 镜像：" >> README-7zip.md
          echo "" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "# 导入 CN 镜像（tar.gz 格式）" >> README-7zip.md
          echo "docker load < n8n-chinese-cn-${N8N_VERSION}.tar.gz" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "# 导入 n8n-runners 镜像（tar.gz 格式）" >> README-7zip.md
          echo "docker load < n8n-runners-${N8N_VERSION}.tar.gz" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "# 导入 PostgreSQL 镜像（tar.gz 格式）" >> README-7zip.md
          echo "docker load < postgres-16.tar.gz" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "### 3. 验证镜像" >> README-7zip.md
          echo "" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker images | grep n8n" >> README-7zip.md
          echo "docker images | grep postgres" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "### 4. 运行容器" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**方式一：使用默认 SQLite 数据库（单容器）**" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker run -d --name n8n \\" >> README-7zip.md
          echo "  -p 5678:5678 \\" >> README-7zip.md
          echo "  -v n8n_data:/home/node/.n8n \\" >> README-7zip.md
          echo "  ${DOCKER_USER}/n8n-chinese-cn:${N8N_VERSION}" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**方式二：使用 PostgreSQL 数据库（推荐生产环境）**" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "先运行 PostgreSQL：" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker run -d --name postgres \\" >> README-7zip.md
          echo "  -e POSTGRES_USER=n8n \\" >> README-7zip.md
          echo "  -e POSTGRES_PASSWORD=n8n \\" >> README-7zip.md
          echo "  -e POSTGRES_DB=n8n \\" >> README-7zip.md
          echo "  -v postgres_data:/var/lib/postgresql/data \\" >> README-7zip.md
          echo "  postgres:16" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "然后运行 n8n：" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker run -d --name n8n \\" >> README-7zip.md
          echo "  -p 5678:5678 \\" >> README-7zip.md
          echo "  -e DB_TYPE=postgresdb \\" >> README-7zip.md
          echo "  -e DB_POSTGRESDB_HOST=postgres \\" >> README-7zip.md
          echo "  -e DB_POSTGRESDB_PORT=5432 \\" >> README-7zip.md
          echo "  -e DB_POSTGRESDB_DATABASE=n8n \\" >> README-7zip.md
          echo "  -e DB_POSTGRESDB_USER=n8n \\" >> README-7zip.md
          echo "  -e DB_POSTGRESDB_PASSWORD=n8n \\" >> README-7zip.md
          echo "  --link postgres:postgres \\" >> README-7zip.md
          echo "  ${DOCKER_USER}/n8n-chinese-cn:${N8N_VERSION}" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**运行 n8n-runners:**" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker run -d --name n8n-runner \\" >> README-7zip.md
          echo "  n8nio/runners:${N8N_VERSION}" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "### 5. 使用 Docker Compose（推荐）" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "创建 \`docker-compose.yml\` 文件：" >> README-7zip.md
          echo "" >> README-7zip.md
          echo '```yaml' >> README-7zip.md
          echo 'version: "3.8"' >> README-7zip.md
          echo 'services:' >> README-7zip.md
          echo '  postgres:' >> README-7zip.md
          echo '    image: postgres:16' >> README-7zip.md
          echo '    environment:' >> README-7zip.md
          echo '      - POSTGRES_USER=n8n' >> README-7zip.md
          echo '      - POSTGRES_PASSWORD=n8n' >> README-7zip.md
          echo '      - POSTGRES_DB=n8n' >> README-7zip.md
          echo '    volumes:' >> README-7zip.md
          echo '      - postgres_data:/var/lib/postgresql/data' >> README-7zip.md
          echo "" >> README-7zip.md
          echo '  n8n:' >> README-7zip.md
          echo "    image: ${DOCKER_USER}/n8n-chinese-cn:${N8N_VERSION}" >> README-7zip.md
          echo '    ports:' >> README-7zip.md
          echo '      - "5678:5678"' >> README-7zip.md
          echo '    environment:' >> README-7zip.md
          echo '      - N8N_BASIC_AUTH_ACTIVE=true' >> README-7zip.md
          echo '      - N8N_BASIC_AUTH_USER=admin' >> README-7zip.md
          echo '      - N8N_BASIC_AUTH_PASSWORD=password' >> README-7zip.md
          echo '      - N8N_HOST=localhost' >> README-7zip.md
          echo '      - N8N_PORT=5678' >> README-7zip.md
          echo '      - N8N_PROTOCOL=http' >> README-7zip.md
          echo '      - DB_TYPE=postgresdb' >> README-7zip.md
          echo '      - DB_POSTGRESDB_HOST=postgres' >> README-7zip.md
          echo '      - DB_POSTGRESDB_PORT=5432' >> README-7zip.md
          echo '      - DB_POSTGRESDB_DATABASE=n8n' >> README-7zip.md
          echo '      - DB_POSTGRESDB_USER=n8n' >> README-7zip.md
          echo '      - DB_POSTGRESDB_PASSWORD=n8n' >> README-7zip.md
          echo '    volumes:' >> README-7zip.md
          echo '      - n8n_data:/home/node/.n8n' >> README-7zip.md
          echo '    depends_on:' >> README-7zip.md
          echo '      - postgres' >> README-7zip.md
          echo "" >> README-7zip.md
          echo 'volumes:' >> README-7zip.md
          echo '  n8n_data:' >> README-7zip.md
          echo '  postgres_data:' >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "然后启动：" >> README-7zip.md
          echo '```bash' >> README-7zip.md
          echo "docker-compose up -d" >> README-7zip.md
          echo '```' >> README-7zip.md
          echo "" >> README-7zip.md
          echo "## 镜像信息" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "- **版本**: ${N8N_VERSION}" >> README-7zip.md
          echo "- **架构**: linux/amd64, linux/arm64" >> README-7zip.md
          echo "- **打包日期**: $(date +'%Y-%m-%d')" >> README-7zip.md
          echo "- **压缩格式**: 7zip (LZMA2, 最大压缩)" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "## 相关链接" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "- 项目主页: https://github.com/msola-ht/n8n-i18n-chinese-docker" >> README-7zip.md
          echo "- Docker Hub (CN): https://hub.docker.com/r/${DOCKER_USER}/n8n-chinese-cn" >> README-7zip.md
          echo "- Docker Hub (runners): https://hub.docker.com/r/n8nio/runners" >> README-7zip.md
          echo "- Docker Hub (PostgreSQL): https://hub.docker.com/_/postgres" >> README-7zip.md
          echo "- 官方文档: https://docs.n8n.io/" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "## 常见问题" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Q: 为什么要使用 7zip 格式？**" >> README-7zip.md
          echo "A: 7zip 使用 LZMA2 算法，压缩率比 gzip 高 30-50%，可以节省下载时间和存储空间。" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Q: 如何在 Windows 上解压 7z 文件？**" >> README-7zip.md
          echo "A: 需要安装 7-Zip（https://www.7-zip.org/），安装后右键点击文件选择\"提取到当前文件夹\"即可。" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Q: 导入镜像后如何验证？**" >> README-7zip.md
          echo "A: 运行 \`docker images\` 命令，应该能看到 n8n-chinese-cn、n8n-runners 和 postgres 镜像。" >> README-7zip.md
          echo "" >> README-7zip.md
          echo "**Q: 使用 SQLite 还是 PostgreSQL？**" >> README-7zip.md
          echo "A:" >> README-7zip.md
          echo "- SQLite：适合开发测试，配置简单，单容器即可" >> README-7zip.md
          echo "- PostgreSQL：适合生产环境，性能更好，支持并发访问" >> README-7zip.md

      - name: 上传 7zip 压缩包到 GitHub Releases
        if: steps.check_release.outputs.need_images == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          UPSTREAM_TAG: ${{ steps.get_n8n_version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          echo "📤 开始上传 7zip 压缩包到发行版..."
          echo "压缩包名称: ${ARCHIVE_NAME}"
          echo "目标 Release: ${UPSTREAM_TAG}"

          # 检查文件是否存在
          if [ ! -f "${ARCHIVE_NAME}" ]; then
            echo "❌ 错误：压缩包文件不存在: ${ARCHIVE_NAME}"
            exit 1
          fi

          echo "✅ 压缩包文件存在，大小: $(du -h "${ARCHIVE_NAME}" | cut -f1)"

          # 检查是否已存在 Release
          RELEASE_EXISTS=false
          if gh release view "${UPSTREAM_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            echo "✅ Release ${UPSTREAM_TAG} 已存在"
          else
            echo "✅ Release ${UPSTREAM_TAG} 不存在，将创建新 Release"
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            # 删除旧的 7zip 文件（如果存在）
            echo "🔍 检查并删除旧的文件..."
            OLD_7Z_ASSET=$(gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[] | select(.name | endswith("-镜像.7z") or .name | endswith("-.7z")) | .name' 2>/dev/null || echo "")
            if [ -n "$OLD_7Z_ASSET" ]; then
              echo "$OLD_7Z_ASSET" | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "${UPSTREAM_TAG}" "$asset" --yes 2>/dev/null || true
              done
              echo "✅ 已删除旧的 7zip 文件"
            fi

            # 删除旧的 README 文件（如果存在）
            OLD_README=$(gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[] | select(.name == "README-7zip.md") | .name' 2>/dev/null || echo "")
            if [ -n "$OLD_README" ]; then
              echo "🗑️ 删除旧的 README-7zip.md..."
              gh release delete-asset "${UPSTREAM_TAG}" "README-7zip.md" --yes 2>/dev/null || true
              echo "✅ 已删除旧的 README 文件"
            fi

            # 上传新的 7zip 压缩包和说明文档
            echo "📤 上传文件到 Release..."
            gh release upload "${UPSTREAM_TAG}" \
              "${ARCHIVE_NAME}" \
              README-7zip.md

            if [ $? -eq 0 ]; then
              echo "✅ 文件上传成功"
            else
              echo "❌ 文件上传失败"
              exit 1
            fi
          else
            echo "📝 创建新的 Release..."

            # 创建 Release Notes
            echo "## n8n 镜像 7zip 压缩包" > /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "包含以下镜像：" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "1. **CN 镜像（国内源优化版）**" >> /tmp/7zip-release-notes.txt
            echo "   - 使用国内 npm 镜像源构建" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "2. **n8n-runners 官方镜像**" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "3. **PostgreSQL 数据库镜像**" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "版本: ${N8N_VERSION}" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "### 使用方法" >> /tmp/7zip-release-notes.txt
            echo "" >> /tmp/7zip-release-notes.txt
            echo "请查看 README-7zip.md 文件了解详细使用说明。" >> /tmp/7zip-release-notes.txt

            # 创建 Release 并上传文件
            gh release create "${UPSTREAM_TAG}" \
              "${ARCHIVE_NAME}" \
              README-7zip.md \
              --title "n8n 镜像 7zip 压缩包 v${N8N_VERSION}" \
              --notes-file /tmp/7zip-release-notes.txt

            if [ $? -eq 0 ]; then
              echo "✅ Release 创建并上传成功"
            else
              echo "❌ Release 创建失败"
              exit 1
            fi
          fi

          echo ""
          echo "=========================================="
          echo "✅ 7zip 压缩包已成功上传到 Release ${UPSTREAM_TAG}"
          echo "=========================================="

      - name: 更新 Docker_N8N 目录的 .env 文件
        if: steps.check_release.outputs.need_docker_n8n == 'true'
        env:
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
        run: |
          echo "📝 更新 Docker_N8N/.env 文件中的版本号..."

          # 使用 sed 替换 N8N_VERSION
          if [[ "$OSTYPE" == "darwin"* ]]; then
            # macOS 环境
            sed -i '' "s/^N8N_VERSION=.*/N8N_VERSION=${N8N_VERSION}/" Docker_N8N/.env
          else
            # Linux 环境
            sed -i "s/^N8N_VERSION=.*/N8N_VERSION=${N8N_VERSION}/" Docker_N8N/.env
          fi

          echo "✅ .env 文件已更新为版本: ${N8N_VERSION}"
          echo "验证更新："
          grep "^N8N_VERSION=" Docker_N8N/.env

      - name: 打包 Docker_N8N 目录
        id: package_docker_n8n
        if: steps.check_release.outputs.need_docker_n8n == 'true'
        env:
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
        run: |
          # 生成日期格式：YY-M-D (例如：26-1-9)
          DATE_FORMAT=$(date +'%y-%-m-%-d')

          # 文件名格式：26-1-9-Docker_N8N-2.2.5.7z
          ARCHIVE_NAME="${DATE_FORMAT}-Docker_N8N-${N8N_VERSION}.7z"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

          echo "📦 开始打包 Docker_N8N 目录..."
          echo "压缩包名称: ${ARCHIVE_NAME}"

          # 使用 7zip 压缩 Docker_N8N 目录
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "${ARCHIVE_NAME}" Docker_N8N/

          echo "✅ Docker_N8N 打包完成"
          echo "📊 压缩包大小: $(du -h "${ARCHIVE_NAME}" | cut -f1)"

      - name: 创建 Docker_N8N 说明文档
        if: steps.check_release.outputs.need_docker_n8n == 'true'
        env:
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
          ARCHIVE_NAME: ${{ steps.package_docker_n8n.outputs.archive_name }}
