            echo "📦 Docker_N8N 部署包:"
            echo "   文件名: ${{ steps.check_release.outputs.docker_n8n_archive }}"
            echo "   版本: ${{ steps.get_n8n_version.outputs.n8n_version }}"
            echo "   状态: ✅ 已打包并上传"
          else
            echo "📦 Docker_N8N 部署包:"
            echo "   文件名: ${{ steps.check_release.outputs.docker_n8n_archive }}"
            echo "   版本: ${{ steps.get_n8n_version.outputs.n8n_version }}"
            echo "   状态: ⏭️ 已存在，跳过打包"
