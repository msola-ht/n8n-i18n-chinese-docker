          echo "" >> README-Docker_N8N.md
          echo "这是 n8n 中文版的 Docker Compose 部署包，包含完整的配置文件和部署脚本。" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 版本信息" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "- **n8n 版本**: ${N8N_VERSION}" >> README-Docker_N8N.md
          echo "- **打包日期**: \$(date +'%Y-%m-%d')" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 包含内容" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "- docker-compose.yml - Docker Compose 配置文件" >> README-Docker_N8N.md
          echo "- .env - 环境变量配置文件（已设置版本号为 ${N8N_VERSION}）" >> README-Docker_N8N.md
          echo "- Start-CN.bat - 中文版启动脚本（Windows）" >> README-Docker_N8N.md
          echo "- Start-EN.bat - 英文版启动脚本（Windows）" >> README-Docker_N8N.md
          echo "- README.md - 使用说明文档" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 快速开始" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "### 1. 解压文件" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "使用 7-Zip 或其他支持 7z 格式的工具解压下载的文件。" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "### 2. 修改配置（可选）" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "编辑 \`.env\` 文件，修改以下重要配置：" >> README-Docker_N8N.md
          echo "- \`N8N_ENCRYPTION_KEY\` - 数据加密密钥（必须修改）" >> README-Docker_N8N.md
          echo "- \`POSTGRES_PASSWORD\` - 数据库密码（必须修改）" >> README-Docker_N8N.md
          echo "- \`N8N_RUNNERS_AUTH_TOKEN\` - Runner 认证令牌（建议修改）" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "### 3. 启动服务" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "**Windows 用户:**" >> README-Docker_N8N.md
          echo '- 双击 \`Start-CN.bat\` 启动中文版' >> README-Docker_N8N.md
          echo '- 或双击 \`Start-EN.bat\` 启动英文版' >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "**Linux/Mac 用户:**" >> README-Docker_N8N.md
          echo '```bash' >> README-Docker_N8N.md
          echo "cd Docker_N8N" >> README-Docker_N8N.md
          echo "docker-compose -f docker-compose-cn.yml up -d" >> README-Docker_N8N.md
          echo '```' >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "### 4. 访问 n8n" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "打开浏览器访问: http://localhost:5678" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 默认账号" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "首次访问需要创建管理员账户。" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 数据持久化" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "所有数据存储在 Docker volume 中：" >> README-Docker_N8N.md
          echo "- \`n8n_data\` - n8n 应用数据" >> README-Docker_N8N.md
          echo "- \`postgres_data\` - PostgreSQL 数据库数据" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
          echo "## 常见问题" >> README-Docker_N8N.md
          echo "" >> README-Docker_N8N.md
