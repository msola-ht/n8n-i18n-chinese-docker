name: 构建 n8n 中文社区版和企业版 Docker 镜像

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_build_community:
        description: '强制重新构建社区版 (即使已存在)'
        required: false
        type: boolean
        default: false
      force_build_enterprise:
        description: '强制重新构建企业版 (即使已存在)'
        required: false
        type: boolean
        default: false
      sync_readme_only:
        description: '仅同步 README 到 Docker Hub (不构建镜像)'
        required: false
        type: boolean
        default: false

env:
  UPSTREAM_REPO: other-blowsnow/n8n-i18n-chinese

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_release.outputs.tag }}
      asset_url: ${{ steps.get_release.outputs.asset_url }}
      n8n_version: ${{ steps.get_n8n_version.outputs.n8n_version }}
      build_community: ${{ steps.check_images.outputs.build_community }}
      build_enterprise: ${{ steps.check_images.outputs.build_enterprise }}
      should_run_anything: ${{ steps.check_images.outputs.should_run_anything }}

    steps:
      - name: 拉取当前仓库代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 获取上游最新发布信息
        id: get_release
        run: |
          latest_release=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          tag=$(echo "$latest_release" | jq -r .tag_name | xargs)
          asset_url=$(echo "$latest_release" | jq -r '.assets[] | select(.name|endswith(".tar.gz")) | .browser_download_url' | xargs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: 从标签中提取 n8n 版本号
        id: get_n8n_version
        run: |
          TAG_REF="${{ steps.get_release.outputs.tag }}"
          N8N_VERSION=$(echo "${TAG_REF#n8n@}" | xargs)
          echo "n8n_version=$N8N_VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到上游版本: ${N8N_VERSION}"

      - name: 设置 Docker Buildx 用于多架构检查
        uses: docker/setup-buildx-action@v3

      - name: 检查 Docker Hub 上的多架构镜像是否存在
        id: check_images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          N8N_VERSION: ${{ steps.get_n8n_version.outputs.n8n_version }}
        run: |
          BUILD_COMMUNITY="false"
          BUILD_ENTERPRISE="false"

          # 检查社区版镜像
          COMMUNITY_IMAGE="${DOCKERHUB_USERNAME}/n8n-chinese"
          COMMUNITY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${COMMUNITY_IMAGE}/tags/${N8N_VERSION}")
          echo "检查社区版镜像 ${COMMUNITY_IMAGE}:${N8N_VERSION} -> 状态码: ${COMMUNITY_STATUS}"

          if [[ "${{ github.event.inputs.force_build_community }}" == "true" || "$COMMUNITY_STATUS" != "200" ]]; then
            BUILD_COMMUNITY="true"
            echo "需要构建社区版镜像: 强制构建=${{ github.event.inputs.force_build_community }}, 镜像不存在=$([[ "$COMMUNITY_STATUS" != "200" ]] && echo true || echo false)"
          else
            # 如果镜像存在，进一步检查多架构支持
            echo "正在检查社区版镜像的多架构支持..."
            docker buildx imagetools inspect "${COMMUNITY_IMAGE}:${N8N_VERSION}" 2>/dev/null && {
              HAS_AMD64=$(docker buildx imagetools inspect "${COMMUNITY_IMAGE}:${N8N_VERSION}" | grep -q "Platform:    linux/amd64" && echo "true" || echo "false")
              HAS_ARM64=$(docker buildx imagetools inspect "${COMMUNITY_IMAGE}:${N8N_VERSION}" | grep -q "Platform:    linux/arm64" && echo "true" || echo "false")
              echo "架构检查结果: AMD64=$HAS_AMD64, ARM64=$HAS_ARM64"
              if [[ "$HAS_AMD64" == "true" && "$HAS_ARM64" == "true" ]]; then
                echo "社区版镜像已支持 linux/amd64 和 linux/arm64 架构"
              else
                echo "社区版镜像架构不完整: AMD64=$HAS_AMD64, ARM64=$HAS_ARM64"
                BUILD_COMMUNITY="true"
              fi
            } || {
              echo "无法检查社区版镜像架构，需要重新构建"
              BUILD_COMMUNITY="true"
            }
          fi

          # 检查企业版镜像
          ENTERPRISE_IMAGE="${DOCKERHUB_USERNAME}/n8n-chinese-enterprise"
          ENTERPRISE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${ENTERPRISE_IMAGE}/tags/${N8N_VERSION}")
          echo "检查企业版镜像 ${ENTERPRISE_IMAGE}:${N8N_VERSION} -> 状态码: ${ENTERPRISE_STATUS}"

          if [[ "${{ github.event.inputs.force_build_enterprise }}" == "true" || "$ENTERPRISE_STATUS" != "200" ]]; then
            BUILD_ENTERPRISE="true"
            echo "需要构建企业版镜像: 强制构建=${{ github.event.inputs.force_build_enterprise }}, 镜像不存在=$([[ "$ENTERPRISE_STATUS" != "200" ]] && echo true || echo false)"
          else
            # 如果镜像存在，进一步检查多架构支持
            echo "正在检查企业版镜像的多架构支持..."
            docker buildx imagetools inspect "${ENTERPRISE_IMAGE}:${N8N_VERSION}" 2>/dev/null && {
              HAS_AMD64=$(docker buildx imagetools inspect "${ENTERPRISE_IMAGE}:${N8N_VERSION}" | grep -q "Platform:    linux/amd64" && echo "true" || echo "false")
              HAS_ARM64=$(docker buildx imagetools inspect "${ENTERPRISE_IMAGE}:${N8N_VERSION}" | grep -q "Platform:    linux/arm64" && echo "true" || echo "false")
              echo "架构检查结果: AMD64=$HAS_AMD64, ARM64=$HAS_ARM64"
              if [[ "$HAS_AMD64" == "true" && "$HAS_ARM64" == "true" ]]; then
                echo "企业版镜像已支持 linux/amd64 和 linux/arm64 架构"
              else
                echo "企业版镜像架构不完整: AMD64=$HAS_AMD64, ARM64=$HAS_ARM64"
                BUILD_ENTERPRISE="true"
              fi
            } || {
              echo "无法检查企业版镜像架构，需要重新构建"
              BUILD_ENTERPRISE="true"
            }
          fi

          echo "build_community=${BUILD_COMMUNITY}" >> "$GITHUB_OUTPUT"
          echo "build_enterprise=${BUILD_ENTERPRISE}" >> "$GITHUB_OUTPUT"

          if [[ "$BUILD_COMMUNITY" == "true" || "$BUILD_ENTERPRISE" == "true" ]]; then
            echo "should_run_anything=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run_anything=false" >> "$GITHUB_OUTPUT"
            echo "所有多架构镜像均已存在且未强制构建，无需执行任何操作。"
          fi

  build-and-push-community:
    needs: check
    if: needs.check.outputs.build_community == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置 Docker Hub 用户名
        run: echo "DOCKERHUB_USERNAME=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | xargs)" >> "$GITHUB_ENV"

      - name: 下载并解压
        run: |
          mkdir -p src-dist
          curl -L "${{ needs.check.outputs.asset_url }}" -o src-dist/editor-ui.tar.gz
          tar -xzvf src-dist/editor-ui.tar.gz -C src-dist
          
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送社区版
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}
            ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            N8N_VERSION=${{ needs.check.outputs.n8n_version }}

      - name: 导出社区版镜像
        run: |
          echo "📦 开始导出社区版镜像..."
          mkdir -p docker-images
          docker pull ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}
          echo "正在导出镜像 ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}..."
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }} | \
            gzip > "docker-images/n8n-chinese-${{ needs.check.outputs.n8n_version }}.tar.gz"

      - name: 创建文档
        run: |
          # 使用 printf 创建 README 文件，避免 heredoc 问题
          printf '# n8n 中文版 Docker 镜像\n\n## 镜像信息\n- 版本: %s\n- 镜像: %s\n- 架构: linux/amd64, linux/arm64\n\n## 导入镜像\n\n1. 将镜像文件下载到本地\n2. 直接导入镜像（无需解压）：\n   ```bash\n   docker load -i n8n-chinese-%s.tar.gz\n   ```\n   \n   或使用以下命令：\n   ```bash\n   docker load < n8n-chinese-%s.tar.gz\n   ```\n\n## 运行容器\n\n```bash\ndocker run -d --name n8n \\\n  -p 5678:5678 \\\n  -v n8n_data:/home/node/.n8n \\\n  %s\n```\n\n## 更多信息\n\n- 项目主页: https://github.com/msola-ht/n8n-i18n-chinese-docker\n- Docker Hub: https://hub.docker.com/r/%s/n8n-chinese\n' \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}" \
            > docker-images/README.md

      - name: 生成镜像信息
        run: |
          echo '{' > docker-images/image-info.json
          echo '  "version": "${{ needs.check.outputs.n8n_version }}",' >> docker-images/image-info.json
          echo '  "image": "${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}",' >> docker-images/image-info.json
          echo '  "platforms": ["linux/amd64", "linux/arm64"],' >> docker-images/image-info.json
          echo '  "build_date": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",' >> docker-images/image-info.json
          echo '  "upstream_tag": "${{ needs.check.outputs.tag }}"' >> docker-images/image-info.json
          echo '}' >> docker-images/image-info.json

      - name: 输出导出信息
        run: |
          echo "::notice::镜像已导出为: docker-images/n8n-chinese-${{ needs.check.outputs.n8n_version }}.tar.gz"
          echo "::notice::镜像大小: $(du -h docker-images/n8n-chinese-${{ needs.check.outputs.n8n_version }}.tar.gz | cut -f1)"

      - name: 上传镜像归档到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n8n-chinese-image-${{ needs.check.outputs.n8n_version }}
          path: docker-images/
          retention-days: 30

      - name: 输出社区版构建信息
        run: |
          echo "✅ 社区版镜像构建成功"
          echo "📦 镜像标签: ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese:${{ needs.check.outputs.n8n_version }}"
          echo "🏗️  支持架构: linux/amd64, linux/arm64"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/n8n-chinese"
          echo "💾 镜像归档: 已上传到 GitHub Actions Artifacts"

  build-and-push-enterprise:
    needs: [check, build-and-push-community]
    if: always() && needs.check.outputs.build_enterprise == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置 Docker Hub 用户名
        run: echo "DOCKERHUB_USERNAME=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | xargs)" >> "$GITHUB_ENV"

      - name: 准备企业版文件
        # 这里进行了拆分：先生成 JS 文件，再生成 Dockerfile，避免嵌套 Heredoc 错误
        run: |
          # 1. 生成 Mock JS 文件
          cat <<'JSEOF' > enterprise-mock.js
          const originalInit = BaseCommand.prototype.init; const originalInitLicense = BaseCommand.prototype.initLicense; function initEnterpriseMock() { const { Container } = require("@n8n/di"); const { License } = require("../license"); const { LICENSE_QUOTAS, LICENSE_FEATURES, UNLIMITED_LICENSE_QUOTA } = require("@n8n/constants"); try { const license = Container.get(License); if (!license) { console.warn("[ENTERPRISE MOCK] License service not available"); return; } license.isLicensed = function(feature) { if (feature === "feat:showNonProdBanner") { return false; } return true; }; const origialGetValue = license.getValue.bind(license); license.getValue = (feature) => { if (feature === "planName") { return "Enterprise (Mocked)"; } if (Object.values(LICENSE_QUOTAS).includes(feature)) { return UNLIMITED_LICENSE_QUOTA; } if (Object.values(LICENSE_FEATURES).includes(feature)) { return true; } return origialGetValue(feature); }; ["isAdvancedPermissionsLicensed", "isSharingEnabled", "isLdapEnabled", "isSamlEnabled", "isSourceControlLicensed", "isVariablesEnabled", "isExternalSecretsEnabled", "isWorkflowHistoryLicensed", "isLogStreamingEnabled", "isMultiMainLicensed", "isBinaryDataS3Licensed", "isDebugInEditorLicensed", "isWorkerViewLicensed", "isAiCreditsEnabled", "isFoldersEnabled", "isProjectRoleAdminLicensed", "isProjectRoleEditorLicensed", "isProjectRoleViewerLicensed", "isCustomNpmRegistryEnabled", "isWithinUsersLimit"].forEach((key) => { license[key] = () => true; }); ["getUsersLimit", "getTriggerLimit", "getVariablesLimit", "getWorkflowHistoryPruneLimit", "getTeamProjectLimit"].forEach((key) => { license[key] = () => UNLIMITED_LICENSE_QUOTA; }); license.isAPIDisabled = () => false; license.isAiAssistantEnabled = () => false; license.getAiCredits = () => 999999; license.getPlanName = () => "Enterprise (Mocked)"; license.getConsumerId = () => "enterprise-mock-consumer"; license.getManagementJwt = () => "mock-jwt-token"; console.log("[ENTERPRISE MOCK] ✅ All enterprise features enabled"); } catch (error) { console.error("[ENTERPRISE MOCK] Failed to enable enterprise mock:", error); } } BaseCommand.prototype.init = async function() { await originalInit.call(this); await this.initLicense(); }; BaseCommand.prototype.initLicense = async function() { await originalInitLicense.call(this); initEnterpriseMock(); };
          JSEOF

          # 2. 生成 Dockerfile (使用 COPY 指令而不是内部生成)
          cat <<EOF > Dockerfile.enterprise
          FROM $DOCKERHUB_USERNAME/n8n-chinese:${{ needs.check.outputs.n8n_version }}
          USER root

          # 将上面生成的 JS 文件复制到镜像中
          COPY enterprise-mock.js /tmp/enterprise-mock.js

          ENV TARGET_FILE=/usr/local/lib/node_modules/n8n/dist/commands/base-command.js

          # 执行注入逻辑
          RUN set -e; \
              awk '/^exports\.BaseCommand = BaseCommand;$/{system("cat /tmp/enterprise-mock.js")}1' \${TARGET_FILE} > \${TARGET_FILE}.tmp; \
              mv \${TARGET_FILE}.tmp \${TARGET_FILE}; \
              rm /tmp/enterprise-mock.js;

          USER node
          EOF
          
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送企业版
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.enterprise
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }}
            ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出企业版镜像
        run: |
          echo "📦 开始导出企业版镜像..."
          mkdir -p docker-images-enterprise
          docker pull ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }}
          echo "正在导出镜像 ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }}..."
          docker save ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }} | \
            gzip > "docker-images-enterprise/n8n-chinese-enterprise-${{ needs.check.outputs.n8n_version }}.tar.gz"

      - name: 创建企业版文档
        run: |
          printf '# n8n 中文企业版 Docker 镜像\n\n## 镜像信息\n- 版本: %s\n- 镜像: %s/n8n-chinese-enterprise:%s\n- 架构: linux/amd64, linux/arm64\n- **说明**: 企业版包含所有企业级功能（通过 Mock 激活）\n\n## 企业版功能\n\n- ✅ 高级权限管理\n- ✅ 共享和协作\n- ✅ LDAP/SAML 集成\n- ✅ 源代码控制\n- ✅ 变量管理\n- ✅ 外部密钥集成\n- ✅ 工作流历史\n- ✅ 日志流\n- ✅ 多实例部署\n- ✅ S3 二进制数据存储\n- ✅ 调试模式\n- ✅ Worker 视图\n- ✅ AI 功能\n- ✅ 文件夹组织\n- ✅ 项目角色管理\n- ✅ 自定义 NPM 注册表\n\n## 导入镜像\n\n1. 将镜像文件下载到本地\n2. 直接导入镜像（无需解压）：\n   ```bash\n   docker load -i n8n-chinese-enterprise-%s.tar.gz\n   ```\n   \n   或使用以下命令：\n   ```bash\n   docker load < n8n-chinese-enterprise-%s.tar.gz\n   ```\n\n## 运行容器\n\n```bash\ndocker run -d --name n8n-enterprise \\\n  -p 5678:5678 \\\n  -v n8n_data:/home/node/.n8n \\\n  %s/n8n-chinese-enterprise:%s\n```\n\n## 免责声明\n\n本企业版镜像通过 Mock 方式激活企业功能，仅供学习和测试使用。\n请勿用于生产环境或商业用途。\n\n## 更多信息\n\n- 项目主页: https://github.com/msola-ht/n8n-i18n-chinese-docker\n- Docker Hub: https://hub.docker.com/r/%s/n8n-chinese-enterprise\n' \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}" \
            "${{ needs.check.outputs.n8n_version }}" \
            "${{ env.DOCKERHUB_USERNAME }}" \
            > docker-images-enterprise/README.md

      - name: 生成企业版镜像信息
        run: |
          echo '{' > docker-images-enterprise/image-info.json
          echo '  "version": "${{ needs.check.outputs.n8n_version }}",' >> docker-images-enterprise/image-info.json
          echo '  "edition": "enterprise",' >> docker-images-enterprise/image-info.json
          echo '  "image": "${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }}",' >> docker-images-enterprise/image-info.json
          echo '  "platforms": ["linux/amd64", "linux/arm64"],' >> docker-images-enterprise/image-info.json
          echo '  "build_date": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",' >> docker-images-enterprise/image-info.json
          echo '  "upstream_tag": "${{ needs.check.outputs.tag }}"' >> docker-images-enterprise/image-info.json
          echo '}' >> docker-images-enterprise/image-info.json

      - name: 输出导出信息
        run: |
          echo "::notice::企业版镜像已导出为: docker-images-enterprise/n8n-chinese-enterprise-${{ needs.check.outputs.n8n_version }}.tar.gz"
          echo "::notice::镜像大小: $(du -h docker-images-enterprise/n8n-chinese-enterprise-${{ needs.check.outputs.n8n_version }}.tar.gz | cut -f1)"

      - name: 上传企业版镜像归档到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n8n-chinese-enterprise-image-${{ needs.check.outputs.n8n_version }}
          path: docker-images-enterprise/
          retention-days: 30

      - name: 输出企业版构建信息
        run: |
          echo "✅ 企业版镜像构建成功"
          echo "📦 镜像标签: ${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise:${{ needs.check.outputs.n8n_version }}"
          echo "🏗️  支持架构: linux/amd64, linux/arm64"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise"
          echo "🚀 企业版功能已全部启用"
          echo "💾 镜像归档: 已上传到 GitHub Actions Artifacts"

  finalize_release:
    needs: [check, build-and-push-community, build-and-push-enterprise]
    if: always() && needs.check.outputs.should_run_anything == 'true' && (needs.build-and-push-community.result != 'failure' && needs.build-and-push-enterprise.result != 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 更新文档和推送标签
        env:
          NEW_VERSION: ${{ needs.check.outputs.n8n_version }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch --tags
          # 更新镜像标签中的版本号（只更新带版本号的，不影响 latest）
          sed -i "s|${DOCKER_USER}/n8n-chinese:[0-9]\+\.[0-9]\+\.[0-9]\+|${DOCKER_USER}/n8n-chinese:${NEW_VERSION}|g" README.md
          sed -i "s|${DOCKER_USER}/n8n-chinese-enterprise:[0-9]\+\.[0-9]\+\.[0-9]\+|${DOCKER_USER}/n8n-chinese-enterprise:${NEW_VERSION}|g" README.md

          # 更新版本号文本
          sed -i 's/\*\*当前版本\*\*: `[0-9.]*`/**当前版本**: `'${NEW_VERSION}'`/g' README.md

          # 更新镜像信息表格中的版本号
          sed -i 's/或 `[0-9]\+\.[0-9]\+\.[0-9]\+`/或 `'${NEW_VERSION}'`/g' README.md

          # 更新离线下载文件名中的版本号
          sed -i 's/n8n-chinese-[0-9]\+\.[0-9]\+\.[0-9]\+\.tar.gz/n8n-chinese-'${NEW_VERSION}'.tar.gz/g' README.md
          sed -i 's/n8n-chinese-enterprise-[0-9]\+\.[0-9]\+\.[0-9]\+\.tar.gz/n8n-chinese-enterprise-'${NEW_VERSION}'.tar.gz/g' README.md

          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "ci: 自动更新版本标签至 ${NEW_VERSION}"
            git pull --rebase
            git push
          fi

          if ! git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}"; then
            git tag "${UPSTREAM_TAG}"
            git push origin "${UPSTREAM_TAG}"
          fi

      - name: 同步 README 到 Docker Hub（社区版）
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese
          short-description: "自动构建包含完整中文语言包的 n8n Docker 镜像"
          readme-filepath: README.md

      - name: 同步 README 到 Docker Hub（企业版）
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise
          short-description: "包含所有企业功能的 n8n 中文版 Docker 镜像（仅供学习测试）"
          readme-filepath: README.md

  create_release:
    needs: [check, build-and-push-community]
    if: always() && needs.check.outputs.should_run_anything == 'true' && needs.build-and-push-community.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 下载社区版镜像归档
        uses: actions/download-artifact@v4
        with:
          name: n8n-chinese-image-${{ needs.check.outputs.n8n_version }}
          path: docker-images/

      - name: 下载企业版镜像归档（如果存在）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: n8n-chinese-enterprise-image-${{ needs.check.outputs.n8n_version }}
          path: docker-images-enterprise/

      - name: 检查文件
        run: |
          echo "下载的社区版文件："
          ls -la docker-images/
          echo ""
          echo "下载的企业版文件："
          if [ -d "docker-images-enterprise" ]; then
            ls -la docker-images-enterprise/
          else
            echo "企业版文件不存在"
          fi

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ needs.check.outputs.n8n_version }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 检查是否已存在 Release（使用更可靠的方法）
          RELEASE_EXISTS=false
          if gh release view "${UPSTREAM_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            echo "Release ${UPSTREAM_TAG} 已存在，将更新资产..."
          else
            echo "Release ${UPSTREAM_TAG} 不存在，将创建新 Release..."
          fi

          # 检查企业版文件是否存在
          ENTERPRISE_FILES_EXIST=false
          if [ -f "docker-images-enterprise/n8n-chinese-enterprise-${N8N_VERSION}.tar.gz" ]; then
            ENTERPRISE_FILES_EXIST=true
            echo "✅ 企业版文件存在，将包含在 Release 中"
          else
            echo "⚠️ 企业版文件不存在，仅发布社区版"
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            # 删除旧的镜像文件（如果存在）
            OLD_ASSETS=$(gh release view "${UPSTREAM_TAG}" --json assets --jq '.assets[] | select(.name | startswith("n8n-chinese-")) | .name' 2>/dev/null || echo "")
            if [ -n "$OLD_ASSETS" ]; then
              echo "$OLD_ASSETS" | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "${UPSTREAM_TAG}" "$asset" --yes 2>/dev/null || true
              done
            fi

            # 上传新的镜像文件
            echo "上传社区版文件..."
            gh release upload "${UPSTREAM_TAG}" \
              "docker-images/n8n-chinese-${N8N_VERSION}.tar.gz" \
              "docker-images/README.md" \
              "docker-images/image-info.json" || echo "社区版资产上传失败"

            if [ "$ENTERPRISE_FILES_EXIST" = true ]; then
              echo "上传企业版文件..."
              gh release upload "${UPSTREAM_TAG}" \
                "docker-images-enterprise/n8n-chinese-enterprise-${N8N_VERSION}.tar.gz" \
                "docker-images-enterprise/README.md" \
                "docker-images-enterprise/image-info.json" || echo "企业版资产上传失败"
            fi
          else
            echo "创建新的 Release ${UPSTREAM_TAG}..."

            # 创建 Release
            NOTES_FILE="/tmp/release-notes.txt"
            printf '## n8n 中文版 Docker 镜像 v%s\n\n### 社区版\n- 镜像: %s/n8n-chinese:%s\n- Docker Hub: https://hub.docker.com/r/%s/n8n-chinese\n\n### 企业版\n- 镜像: %s/n8n-chinese-enterprise:%s\n- Docker Hub: https://hub.docker.com/r/%s/n8n-chinese-enterprise\n- **说明**: 企业版包含所有企业级功能（通过 Mock 激活）\n\n### 新增功能\n- 🐳 完整的中文界面支持\n- 🏗️ 多架构支持（linux/amd64, linux/arm64）\n- 📦 Docker 镜像离线导入包\n- 🚀 开箱即用的中文环境\n- 💼 企业版功能（仅供学习测试）\n\n### 使用方法\n\n#### 社区版 - 从 Docker Hub 拉取\n```bash\ndocker run -d --name n8n \\\n  -p 5678:5678 \\\n  -v n8n_data:/home/node/.n8n \\\n  %s/n8n-chinese:%s\n```\n\n#### 企业版 - 从 Docker Hub 拉取\n```bash\ndocker run -d --name n8n-enterprise \\\n  -p 5678:5678 \\\n  -v n8n_data:/home/node/.n8n \\\n  %s/n8n-chinese-enterprise:%s\n```\n\n#### 离线导入（下载下方 tar.gz 文件）\n\n**社区版**:\n1. 下载 n8n-chinese-%s.tar.gz\n2. 直接导入镜像：\n   ```bash\n   docker load -i n8n-chinese-%s.tar.gz\n   ```\n\n**企业版**:\n1. 下载 n8n-chinese-enterprise-%s.tar.gz\n2. 直接导入镜像：\n   ```bash\n   docker load -i n8n-chinese-enterprise-%s.tar.gz\n   ```\n\n### 企业版功能\n\n- ✅ 高级权限管理\n- ✅ 共享和协作\n- ✅ LDAP/SAML 集成\n- ✅ 源代码控制\n- ✅ 变量管理\n- ✅ 外部密钥集成\n- ✅ 工作流历史\n- ✅ 日志流\n- ✅ 多实例部署\n- ✅ S3 二进制数据存储\n- ✅ 调试模式\n- ✅ Worker 视图\n- ✅ AI 功能\n- ✅ 文件夹组织\n- ✅ 项目角色管理\n- ✅ 自定义 NPM 注册表\n\n### 免责声明\n\n企业版镜像通过 Mock 方式激活企业功能，仅供学习和测试使用，请勿用于生产环境或商业用途。\n\n### 更多信息\n\n- 项目主页：https://github.com/msola-ht/n8n-i18n-chinese-docker\n- 上游项目：https://github.com/other-blowsnow/n8n-i18n-chinese' \
              "${N8N_VERSION}" \
              "${DOCKER_USER}" "${N8N_VERSION}" "${DOCKER_USER}" \
              "${DOCKER_USER}" "${N8N_VERSION}" "${DOCKER_USER}" \
              "${DOCKER_USER}" "${N8N_VERSION}" \
              "${DOCKER_USER}" "${N8N_VERSION}" \
              "${N8N_VERSION}" "${N8N_VERSION}" \
              "${N8N_VERSION}" "${N8N_VERSION}" \
              > "${NOTES_FILE}"

            # 构建上传文件列表
            UPLOAD_FILES=(
              "docker-images/n8n-chinese-${N8N_VERSION}.tar.gz"
              "docker-images/README.md"
              "docker-images/image-info.json"
            )

            if [ "$ENTERPRISE_FILES_EXIST" = true ]; then
              UPLOAD_FILES+=(
                "docker-images-enterprise/n8n-chinese-enterprise-${N8N_VERSION}.tar.gz"
                "docker-images-enterprise/README.md"
                "docker-images-enterprise/image-info.json"
              )
            fi

            # 创建 Release 并上传文件
            gh release create "${UPSTREAM_TAG}" \
              "${UPLOAD_FILES[@]}" \
              --title "n8n 中文版 v${N8N_VERSION}" \
              --notes-file "${NOTES_FILE}" || echo "Release 创建失败，可能已存在"
          fi

          echo "✅ Release ${UPSTREAM_TAG} 已更新完成"
          if [ "$ENTERPRISE_FILES_EXIST" = true ]; then
            echo "包含社区版和企业版"
          else
            echo "仅包含社区版"
          fi

  sync-readme-to-dockerhub:
    if: github.event.inputs.sync_readme_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 同步 README 到 Docker Hub（社区版）
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese
          short-description: "自动构建包含完整中文语言包的 n8n Docker 镜像"
          readme-filepath: README.md

      - name: 同步 README 到 Docker Hub（企业版）
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise
          short-description: "包含所有企业功能的 n8n 中文版 Docker 镜像（仅供学习测试）"
          readme-filepath: README.md

      - name: 输出同步结果
        run: |
          echo "✅ README 已同步到 Docker Hub"
          echo "社区版: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese"
          echo "企业版: ${{ secrets.DOCKERHUB_USERNAME }}/n8n-chinese-enterprise"
