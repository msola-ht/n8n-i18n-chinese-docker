volumes:
  n8n_db_storage:  # 数据库数据存储卷
  n8n_storage:  # n8n应用数据存储卷

# 自定义网络配置
networks:
  n8n-network:
    driver: bridge  # 使用桥接网络模式
    name: n8n-internal  # 网络名称

services:
  # n8n 主应用服务
  n8n:
    image: lunare/n8n-chinese-cn:${N8N_VERSION}
    networks:
      - n8n-network  # 连接到自定义网络
    restart: always
    environment:
      - N8N_DEFAULT_LOCALE=zh-CN  # 界面语言

      # 代理设置(按需启用)
      # - HTTP_PROXY=http://${PROXY_HTTP_HOST:-host.docker.internal}:${PROXY_HTTP_PORT:-7897}
      # - HTTPS_PROXY=http://${PROXY_HTTPS_HOST:-host.docker.internal}:${PROXY_HTTPS_PORT:-7897}
      # - NO_PROXY=${NO_PROXY_LIST:-localhost,127.0.0.1,n8n.local,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.local}

      - TZ=Asia/Shanghai  # 时区
      - DB_TYPE=postgresdb  # 数据库类型
      - DB_POSTGRESDB_HOST=postgres  # 数据库主机
      - DB_POSTGRESDB_PORT=5432  # 数据库端口
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}  # 数据库名
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER:-postgres}  # 数据库用户
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}  # 数据库密码

      - EXECUTIONS_DATA_PRUNE=true  # 自动清理执行数据
      - EXECUTIONS_DATA_MAX_AGE=168  # 数据保留时间(小时)
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=100  # 单次清理最大数量

      - N8N_SECURE_COOKIE=false  # 安全Cookie
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}  # 加密密钥(必须设置)
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:7897}  # Webhook地址
      - N8N_RUNNERS_ENABLED=true  # 启用任务运行器

      - N8N_RUNNERS_MODE=external  # 运行器模式
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0  # 代理监听地址
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}  # 运行器认证令牌(必须设置)
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-false}  # 文件权限控制

      - NODES_EXCLUDE="[]"  # 排除节点

      - N8N_DIAGNOSTICS_ENABLED=false  # 禁用诊断

    ports:
      - 5678:5678
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./backup:/home/node/.n8n-files/backup
      - ./input:/home/node/.n8n-files/input
      - ./output:/home/node/.n8n-files/output
    depends_on:
      postgres:
        condition: service_healthy

  # n8n 任务运行器服务
  task-runners:
    image: n8nio/runners:${N8N_VERSION}
    networks:
      - n8n-network  # 连接到自定义网络
    container_name: n8n-runners
    environment:
      - TZ=Asia/Shanghai  # 时区
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679  # 任务代理URI
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}  # 认证令牌(必须设置)
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json
      - ./backup:/home/node/.n8n-files/backup
      - ./input:/home/node/.n8n-files/input
      - ./output:/home/node/.n8n-files/output
    depends_on:
      - n8n

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16
    networks:
      - n8n-network  # 连接到自定义网络
    restart: always
    environment:
      - TZ=Asia/Shanghai  # 时区
      - POSTGRES_USER=${POSTGRES_USER:-postgres}  # 管理员用户名
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}  # 管理员密码(必须设置)
      - POSTGRES_DB=${POSTGRES_DB:-n8n}  # 数据库名
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER:-postgres}  # 应用用户名
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}  # 应用密码(必须设置)
    volumes:
      - n8n_db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
  