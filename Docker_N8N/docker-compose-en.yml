volumes:
  n8n_db_storage:  # Database data storage volume
  n8n_storage:  # n8n application data storage volume

# Custom network configuration
networks:
  n8n-network:
    driver: bridge  # Use bridge network mode
    name: n8n-internal  # Network name

services:
  # n8n main application service
  n8n:
    image: lunare/n8n-chinese:${N8N_VERSION}
    networks:
      - n8n-network  # Connect to custom network
    restart: always
    environment:
      - TZ=Asia/Shanghai  # Timezone
      - DB_TYPE=postgresdb  # Database type
      - DB_POSTGRESDB_HOST=postgres  # Database host
      - DB_POSTGRESDB_PORT=5432  # Database port
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}  # Database name
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER:-postgres}  # Database user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}  # Database password

      - EXECUTIONS_DATA_PRUNE=true  # Auto cleanup execution data
      - EXECUTIONS_DATA_MAX_AGE=168  # Data retention time (hours)
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=100  # Max cleanup count per run

      - N8N_SECURE_COOKIE=false  # Secure cookie
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}  # Encryption key (must be set)
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:7897}  # Webhook URL
      - N8N_RUNNERS_ENABLED=true  # Enable task runners

      - N8N_RUNNERS_MODE=external  # Runner mode
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0  # Broker listen address
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}  # Runner authentication token (must be set)
      - N8N_NATIVE_PYTHON_RUNNER=true  # Native Python runner
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-false}  # File permission control

      - NODES_EXCLUDE="[]"  # Exclude nodes

      - N8N_DIAGNOSTICS_ENABLED=false  # Disable diagnostics
    ports:
      - 5678:5678
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./backup:/home/node/.n8n-files/backup
      - ./input:/home/node/.n8n-files/input
      - ./output:/home/node/.n8n-files/output
    depends_on:
      postgres:
        condition: service_healthy

  # n8n task runner service
  task-runners:
    image: n8nio/runners:${N8N_VERSION}
    networks:
      - n8n-network  # Connect to custom network
    container_name: n8n-runners
    environment:
      - TZ=Asia/Shanghai  # Timezone
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679  # Task broker URI
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}  # Authentication token (must be set)
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json
    depends_on:
      - n8n

  # PostgreSQL database service
  postgres:
    image: postgres:16
    networks:
      - n8n-network  # Connect to custom network
    restart: always
    environment:
      - TZ=Asia/Shanghai  # Timezone
      - POSTGRES_USER=${POSTGRES_USER:-postgres}  # Admin username
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}  # Admin password (must be set)
      - POSTGRES_DB=${POSTGRES_DB:-n8n}  # Database name
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER:-postgres}  # Application username
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}  # Application password (must be set)
    volumes:
      - n8n_db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10